# For details on configuring environment variables, see HELP.md

spring.application.name=cidi

# Datasource configuration: values should be provided via environment variables in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cidi-db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# WeChat credentials - set via env vars (see HELP.md)
wx.appid=${WX_APPID:}
wx.secret=${WX_SECRET:}

# JWT key - provide a strong secret via env var JWT_SECRET
jwt.secret=${JWT_SECRET:}
# Token expiration in ms (default 7 days)
jwt.expiration=${JWT_EXPIRATION:604800000}
