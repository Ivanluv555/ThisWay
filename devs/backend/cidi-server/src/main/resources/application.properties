# application.properties
# 说明：本文件包含 cidi-server 项目的配置，按环境需求调整属性值。

# For details on configuring environment variables, see HELP.md

spring.application.name=cidi
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource configuration: values should be provided via environment variables in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://47.111.180.134:3306/cidi-db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SDP}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# WeChat shared settings
wx.mini-program-env=${WX_MINI_PROGRAM_ENV:dev}
wx.phone-api-url=${WX_PHONE_API_URL:https://api.weixin.qq.com/wxa/business/getuserphonenumber}

# JWT key - provide a strong secret via env var JWT_SECRET
jwt.secret=${JWT_SECRET:}
# Token expiration in ms (default 7 days)
jwt.expiration=${JWT_EXPIRATION:604800000}

server.port=8080
server.address=0.0.0.0

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc.html
