openapi: 3.0.3
info:
  title: Cidi API
  description: Cidi 接口文档
  version: 1.0.0
servers:
  - url: https://10.69.144.24:3333/api
    description: 生产环境服务器
  - url: http://localhost:8080/api
    description: 本地开发服务器

paths:
  /auth/login:
    post:
      summary: 用户登录
      description: 获取用户 openid 等信息
      responses:
        '200':
          description: 成功返回用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  openid:
                    type: string
                  appid:
                    type: string
                  unionid:
                    type: string
                  userInfo:
                    $ref: '#/components/schemas/UserInfo'
        # 失败场景：请求参数缺失或格式错误
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：登录态无效、code 失效或认证失败
        '401':
          $ref: '#/components/responses/Unauthorized'
        # 失败场景：服务端处理登录逻辑时发生异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts:
    get:
      summary: 获取首页帖子列表
      description: 支持分页获取帖子
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        # 失败场景：分页参数不合法
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：查询帖子列表时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: 发布新帖子
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                userInfo:
                  $ref: '#/components/schemas/UserInfo'
      responses:
        '200':
          description: 发布成功
        # 失败场景：标题、正文或图片参数不合法
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：用户未登录或登录态失效
        '401':
          $ref: '#/components/responses/Unauthorized'
        # 失败场景：用户存在发布权限限制
        '403':
          $ref: '#/components/responses/Forbidden'
        # 失败场景：创建帖子时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      summary: 获取帖子详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/Post'
                  isLiked:
                    type: boolean
                  isCollected:
                    type: boolean
        # 失败场景：帖子 ID 格式错误
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：帖子不存在或已被删除
        '404':
          $ref: '#/components/responses/NotFound'
        # 失败场景：查询帖子详情时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/action:
    post:
      summary: 执行点赞/收藏及取消操作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
                type:
                  type: string
                  enum: [like, collect]
      responses:
        '200':
          description: 执行成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    description: 当前状态，true 为已操作，false 为取消操作
        # 失败场景：postId 或 type 参数不正确
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：用户未登录或登录态失效
        '401':
          $ref: '#/components/responses/Unauthorized'
        # 失败场景：目标帖子不存在
        '404':
          $ref: '#/components/responses/NotFound'
        # 失败场景：点赞或收藏操作执行失败
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}/comments:
    get:
      summary: 获取帖子评论列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        # 失败场景：帖子 ID 格式错误
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：帖子不存在或评论区不可见
        '404':
          $ref: '#/components/responses/NotFound'
        # 失败场景：查询评论列表时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: 发表评论
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                userInfo:
                  $ref: '#/components/schemas/UserInfo'
      responses:
        '200':
          description: 评论成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        # 失败场景：评论内容为空、过长或参数格式错误
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：用户未登录或登录态失效
        '401':
          $ref: '#/components/responses/Unauthorized'
        # 失败场景：目标帖子不存在
        '404':
          $ref: '#/components/responses/NotFound'
        # 失败场景：发表评论时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/collections:
    get:
      summary: 获取我的收藏列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        # 失败场景：用户未登录或登录态失效
        '401':
          $ref: '#/components/responses/Unauthorized'
        # 失败场景：查询收藏列表时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search:
    get:
      summary: 搜索帖子
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Post'
                      locations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Location'
        # 失败场景：keyword 为空或格式不合法
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：搜索服务处理失败
        '500':
          $ref: '#/components/responses/InternalServerError'

  /predict/{spotId}:
    get:
      summary: 获取地点拥挤度预测
      parameters:
        - name: spotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Prediction'
        # 失败场景：spotId 缺失或格式错误
        '400':
          $ref: '#/components/responses/BadRequest'
        # 失败场景：指定地点不存在
        '404':
          $ref: '#/components/responses/NotFound'
        # 失败场景：预测服务暂时不可用，如模型服务离线
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        # 失败场景：获取预测结果时服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /locations:
    get:
      summary: 获取地图地点数据
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
        # 失败场景：地点数据服务异常
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updates:
    get:
      summary: 获取动态列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        # 失败场景：动态列表查询失败
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  # 通用响应定义：统一维护失败场景，避免每个接口重复展开错误结构
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidParam:
              summary: 参数错误示例
              value:
                code: 400
                message: 请求参数不合法
                error: Bad Request
                details:
                  field: spotId
                  reason: spotId 不能为空
    Unauthorized:
      description: 未登录或登录态失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: 未授权示例
              value:
                code: 401
                message: 用户未登录或登录已过期
                error: Unauthorized
    Forbidden:
      description: 无权限执行当前操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 无权限示例
              value:
                code: 403
                message: 当前用户无权限执行该操作
                error: Forbidden
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: 资源不存在示例
              value:
                code: 404
                message: 请求的资源不存在
                error: Not Found
    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              summary: 服务异常示例
              value:
                code: 500
                message: 服务器内部错误，请稍后重试
                error: Internal Server Error
    ServiceUnavailable:
      description: 服务暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serviceUnavailable:
              summary: 服务不可用示例
              value:
                code: 503
                message: 服务暂时不可用，请稍后重试
                error: Service Unavailable
  schemas:
    # 通用错误响应结构：建议后端统一按该格式返回，便于前端拦截和提示
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: 业务状态码或 HTTP 状态码
        message:
          type: string
          description: 面向前端展示的中文错误信息
        error:
          type: string
          description: 标准错误名称，便于日志排查
        details:
          type: object
          description: 可选的补充错误上下文，如字段名、校验原因等
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: 错误发生时间
        path:
          type: string
          description: 当前请求路径
    UserInfo:
      type: object
      properties:
        username:
          type: string
        avatarUrl:
          type: string

    Post:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        content:
          type: string
        images:
          type: array
          items:
            type: string
        createTime:
          type: string
          format: date-time
        viewCount:
          type: integer
        likeCount:
          type: integer
        commentCount:
          type: integer
        author:
          type: string
        authorAvatar:
          type: string

    Comment:
      type: object
      properties:
        _id:
          type: string
        postId:
          type: string
        content:
          type: string
        userInfo:
          $ref: '#/components/schemas/UserInfo'
        createTime:
          type: string
          format: date-time

    Location:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        address:
          type: string
        desc:
          type: string

    Prediction:
      type: object
      properties:
        spotId:
          type: string
        predictTime:
          type: string
        level:
          type: integer
          description: "0: 舒适, 1: 适中, 2: 拥挤, 3: 爆满"
        desc:
          type: string
        count:
          type: integer
        trend:
          type: string
