# Container integration tests: docker compose up -d mysql
# Loaded explicitly by CidiApplicationTests, independently of the remote test configuration.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/cidi_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=cidi_test
spring.datasource.password=cidi_test_local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This isolated test database is disposable. Never point this configuration at development/production.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Context smoke tests do not need persistent HTTP sessions.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

wx.appid=test_appid
wx.secret=test_secret
wx.mock-login-enabled=true
wx.mini-program-env=dev
jwt.secret=local-test-jwt-signing-secret-only-not-for-production-at-least-64-bytes
jwt.expiration=3600000
