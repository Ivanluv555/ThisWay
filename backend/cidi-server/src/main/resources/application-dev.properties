# Local development: docker compose up -d mysql
# Enable: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/cidi_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=cidi_dev
spring.datasource.password=cidi_dev_local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.session.jdbc.initialize-schema=always

# Local-only fallback. Override with JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:local-dev-jwt-signing-secret-only-not-for-production-at-least-64-bytes}
