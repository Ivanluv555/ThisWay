# ============================================================================
# CIDI Server 统一配置文件
# ============================================================================
# 说明：本文件整合了所有环境的配置，通过环境变量控制不同环境的行为
# 详细配置说明请参考：docs/02-开发与运行.md（仓库根目录）
# ============================================================================

# ============================================================================
# 应用基础配置
# ============================================================================
spring.application.name=cidi
server.port=8080
server.address=0.0.0.0

# ============================================================================
# 数据库配置
# ============================================================================
# 数据库连接（默认值已配置，可通过环境变量覆盖）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/cidi_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cidi_dev}
spring.datasource.password=${SDP:cidi_dev_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================================
# 微信小程序配置
# ============================================================================
# 微信 AppID（必填，通过环境变量提供）
wx.appid=${WX_APPID:}

# 微信 Secret（必填，通过环境变量提供）
wx.secret=${WX_SECRET:}

# 微信小程序环境（dev/trial/release，可选）
wx.mini-program-env=${WX_MINI_PROGRAM_ENV:dev}

# 微信手机号接口地址（可选，有默认值）
wx.phone-api-url=${WX_PHONE_API_URL:https://api.weixin.qq.com/wxa/business/getuserphonenumber}

# Mock 登录开关（可选，默认 false）
# 设置为 true 时，可以跳过微信验证，使用任意字符串作为登录 code
wx.mock-login-enabled=${WX_MOCK_LOGIN_ENABLED:false}

# ============================================================================
# JWT 配置
# ============================================================================
# JWT 签名密钥（必填，通过环境变量提供）
jwt.secret=${JWT_SECRET:}

# JWT 过期时间（可选，默认 7 天）
jwt.expiration=${JWT_EXPIRATION:604800000}

# ============================================================================
# API 文档配置
# ============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc.html
