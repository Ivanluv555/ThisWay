<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 接口文档 - Cidi Mock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .json-response {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" x-data="apiDocs()">

    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                </svg>
                <h1 class="text-xl font-bold text-gray-900">Cidi Mock API 文档</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 px-3 py-1 rounded-full text-sm font-medium" 
                     :class="serverOnline ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                    <span class="relative flex h-3 w-3">
                      <span x-show="serverOnline" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3" :class="serverOnline ? 'bg-green-500' : 'bg-red-500'"></span>
                    </span>
                    <span x-text="serverOnline ? '服务在线' : '服务离线'"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- 接口列表部分 -->
        <section>
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                <svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                API 接口列表
            </h2>
            
            <div class="space-y-4">
                <template x-for="(api, index) in apis" :key="index">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden" x-data="{ expanded: false }">
                        <!-- 接口头部 (点击展开) -->
                        <div class="p-4 cursor-pointer hover:bg-gray-50 transition-colors flex items-center justify-between" @click="expanded = !expanded">
                            <div class="flex items-center space-x-4 overflow-hidden">
                                <span class="px-2.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide flex-shrink-0"
                                      :class="{
                                          'bg-blue-100 text-blue-800': api.method === 'GET',
                                          'bg-green-100 text-green-800': api.method === 'POST',
                                          'bg-yellow-100 text-yellow-800': api.method === 'PUT',
                                          'bg-red-100 text-red-800': api.method === 'DELETE'
                                      }" x-text="api.method"></span>
                                <span class="font-mono text-sm text-gray-600 truncate" x-text="api.path"></span>
                                <span class="text-gray-900 font-medium truncate" x-text="api.summary"></span>
                            </div>
                            <svg class="w-5 h-5 text-gray-400 transform transition-transform duration-200" 
                                 :class="{'rotate-180': expanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>

                        <!-- 接口详情 (展开内容) -->
                        <div x-show="expanded" x-collapse x-cloak class="border-t border-gray-100 bg-gray-50 p-6">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <!-- 左侧：参数配置 -->
                                <div>
                                    <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-wider mb-4">请求参数</h3>
                                    <div class="space-y-4">
                                        <template x-for="(param, pIndex) in api.params" :key="pIndex">
                                            <div>
                                                <label class="block text-sm font-medium text-gray-700 mb-1">
                                                    <span x-text="param.name"></span>
                                                    <span x-show="param.required" class="text-red-500">*</span>
                                                    <span class="text-xs text-gray-500 font-normal ml-1" x-text="'(' + param.type + ')'"></span>
                                                </label>
                                                <input type="text" x-model="param.value" 
                                                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border"
                                                       :placeholder="param.description">
                                            </div>
                                        </template>
                                    </div>
                                    
                                    <div class="mt-6">
                                        <button @click="sendRequest(index)" 
                                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                                                :disabled="api.loading">
                                            <svg x-show="api.loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            <span x-text="api.loading ? '请求中...' : '发送请求'"></span>
                                        </button>
                                    </div>
                                </div>

                                <!-- 右侧：响应结果 -->
                                <div class="relative">
                                    <div class="flex items-center justify-between mb-2">
                                        <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-wider">响应结果</h3>
                                        <div class="flex space-x-2">
                                            <span x-show="api.responseTime" class="text-xs text-gray-500" x-text="api.responseTime + ' ms'"></span>
                                            <span x-show="api.status" class="text-xs font-bold px-2 py-0.5 rounded" 
                                                  :class="api.status >= 200 && api.status < 300 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                                                  x-text="'Status: ' + api.status"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="relative group">
                                        <pre class="rounded-lg bg-gray-900 text-gray-100 p-4 text-sm font-mono overflow-auto json-response min-h-[200px]"><code class="language-json" :id="'code-' + index" x-html="api.highlightedResponse || '// 等待请求...'"></code></pre>
                                        
                                        <button x-show="api.response" 
                                                @click="copyToClipboard(api.responseRaw)"
                                                class="absolute top-2 right-2 p-2 bg-gray-700 rounded-md text-gray-300 hover:text-white hover:bg-gray-600 opacity-0 group-hover:opacity-100 transition-opacity"
                                                title="复制结果">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Config 配置说明部分 -->
        <section class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
                <h2 class="text-lg font-bold text-gray-900 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    项目配置 (config.yaml)
                </h2>
                <button @click="copyConfig" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center">
                    <span x-text="configCopied ? '已复制!' : '复制配置'"></span>
                    <svg x-show="!configCopied" class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <svg x-show="configCopied" class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </div>
            <div class="bg-gray-900 p-4 overflow-x-auto">
                <pre><code class="language-yaml" id="config-code">server:
  host: 127.0.0.1
  port: 5000</code></pre>
            </div>
        </section>

    </main>

    <footer class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-500 text-sm border-t border-gray-200 mt-8">
        <p>&copy; 2024 Cidi Mock API. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('apiDocs', () => ({
                serverOnline: false,
                configCopied: false,
                apis: [
                    {
                        method: 'GET',
                        path: '/api/v1/search',
                        summary: '搜索景点信息',
                        params: [
                            { name: 'keyword', type: 'string', required: false, description: '搜索关键词', value: '重庆' },
                            { name: 'pageIndex', type: 'integer', required: false, description: '页码', value: 1 },
                            { name: 'pageSize', type: 'integer', required: false, description: '每页数量', value: 12 }
                        ],
                        loading: false,
                        response: null,
                        responseRaw: '',
                        highlightedResponse: '',
                        status: null,
                        responseTime: null
                    },
                    {
                        method: 'GET',
                        path: '/api/v1/spot/detail',
                        summary: '获取景点详情',
                        params: [
                            { name: 'district_code', type: 'integer', required: false, description: '区域代码', value: 158 },
                            { name: 'sight_code', type: 'integer', required: false, description: '景点代码', value: 45771 }
                        ],
                        loading: false,
                        response: null,
                        responseRaw: '',
                        highlightedResponse: '',
                        status: null,
                        responseTime: null
                    }
                ],

                init() {
                    this.checkServerStatus();
                    // 定时检查服务状态
                    setInterval(() => this.checkServerStatus(), 30000);
                    // 初始化高亮
                    setTimeout(() => Prism.highlightAll(), 100);
                },

                async checkServerStatus() {
                    try {
                        // 使用一个轻量级请求检查
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 2000);
                        
                        const res = await fetch('/api/v1/doc', { 
                            method: 'HEAD',
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        this.serverOnline = res.ok;
                    } catch (e) {
                        this.serverOnline = false;
                    }
                },

                async sendRequest(index) {
                    const api = this.apis[index];
                    api.loading = true;
                    api.response = null;
                    api.status = null;
                    api.responseTime = null;
                    
                    const startTime = Date.now();
                    
                    try {
                        // 构建 URL 参数
                        const url = new URL(api.path, window.location.origin);
                        api.params.forEach(p => {
                            if (p.value !== null && p.value !== '') {
                                url.searchParams.append(p.name, p.value);
                            }
                        });

                        const res = await fetch(url);
                        const endTime = Date.now();
                        
                        api.status = res.status;
                        api.responseTime = endTime - startTime;
                        
                        const data = await res.json();
                        api.response = data;
                        api.responseRaw = JSON.stringify(data, null, 2);
                        
                        // 高亮处理
                        api.highlightedResponse = Prism.highlight(
                            api.responseRaw, 
                            Prism.languages.json, 
                            'json'
                        );
                        
                    } catch (err) {
                        api.status = 'Error';
                        api.responseRaw = err.toString();
                        api.highlightedResponse = `<span class="text-red-400">${err.toString()}</span>`;
                    } finally {
                        api.loading = false;
                    }
                },

                copyToClipboard(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        // 可以添加一个小提示
                        alert('已复制到剪贴板');
                    });
                },

                copyConfig() {
                    const configText = document.getElementById('config-code').textContent;
                    navigator.clipboard.writeText(configText).then(() => {
                        this.configCopied = true;
                        setTimeout(() => this.configCopied = false, 2000);
                    });
                }
            }))
        })
    </script>
</body>
</html>
